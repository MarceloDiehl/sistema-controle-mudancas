spring.application.name=controle-mudancas

# Testes automaticos: banco H2 em memoria (modo MySQL), sem precisar do MySQL.
# As tabelas vem das entidades; os catalogos e precos, do proprio db/ditic_mudancas_db.sql (CatalogoDeTeste).
spring.datasource.url=jdbc:h2:mem:mudancas;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=8088
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Senha inicial do admin nos testes (o teste de ponta a ponta usa a mesma)
mudancas.admin.senha-inicial=admin-inicial
mudancas.redefinir-senha=
