spring.application.name=controle-mudancas

# Senhas e ajustes da maquina ficam em application-local.properties (fora do Git).
# Modelo: application-local.properties.exemplo
spring.config.import=optional:classpath:application-local.properties

# Conexao MySQL (o banco e criado pelo script db/ditic_mudancas_db.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/ditic_mudancas_db?serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:ditic_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# As tabelas vem do script: a aplicacao so confere se as entidades batem com elas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

server.port=8088

# Sessao no servidor: encerra depois de 30 minutos sem uso; cookie sem acesso pelo JavaScript
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Em producao, com HTTPS, ligar tambem: server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie

# Senha do coordenador "admin", criado ao iniciar quando ainda nao existe (trocada no primeiro acesso)
mudancas.admin.senha-inicial=${MUDANCAS_ADMIN_SENHA:}
# Comando administrativo, so quando nenhum coordenador consegue entrar: gera senha temporaria para o usuario
# indicado e mostra no console. Tirar depois de usar.
mudancas.redefinir-senha=
