<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carregar exemplo</title>
</head>
<body>
<p>Carregando as demandas de exemplo…</p>
<script>
  // Página de teste: inclui no navegador duas demandas Para Validação para gerar o relatório.
  //  - 009001: CDS e WECOM (há valor a pagar; custo calculado)
  //  - 009002: só CADI e Selbetti (custo "-" e a frase do valor global do contrato)
  // Abra com dois cliques, a partir desta pasta. Rodar de novo não duplica os exemplos.
  (function () {
    var CHAVE = 'ditic-dsup-mudancas-v5';
    var historico = [{ data: '2026-11-03T09:00', usuario: 'admin', texto: 'Demanda de exemplo criada para testar o relatório.' }];
    var EXEMPLOS = [
      {
        sei: '8.2026.9745/009001-0', descricao: 'Exemplo para testar o relatório: equipamentos e sala de audiência',
        comarca: 'Pelotas', ticketPrincipal: '190100',
        subtickets: [
          { empresa: 'CDS', numero: '190101', finalidade: 'Instalação', quantidade: 3 },
          { empresa: 'CDS', numero: '190102', finalidade: 'Mudança de Prédio', quantidade: 12 },
          { empresa: 'WECOM', numero: '190103', finalidade: 'Realocação', quantidade: 1 },
          { empresa: 'WECOM', numero: '190104', finalidade: 'Instalação', quantidade: 2 },
          { empresa: 'WECOM', numero: '190105', finalidade: 'Infraestrutura', quantidade: 1 },
          { empresa: 'WECOM', numero: '190106', finalidade: 'Infraestrutura', quantidade: 1, metro: 20 }
        ]
      },
      {
        sei: '8.2026.9745/009002-0', descricao: 'Exemplo para testar o relatório: só CADI e Selbetti (valor global do contrato)',
        comarca: 'Santa Maria', ticketPrincipal: '190200',
        subtickets: [
          { empresa: 'CADI', numero: '190201', finalidade: 'Mudança de Local', quantidade: 4 },
          { empresa: 'CADI', numero: '190202', finalidade: 'Habilitação de Pontos de Rede', quantidade: 6 },
          { empresa: 'CADI', numero: '190203', finalidade: 'Configuração', quantidade: 2 },
          { empresa: 'Selbetti', numero: '190204', finalidade: 'Instalação', quantidade: 1 },
          { empresa: 'Selbetti', numero: '190205', finalidade: 'Desinstalação', quantidade: 1 }
        ]
      }
    ];
    var o = JSON.parse(localStorage.getItem(CHAVE) || '{}');
    o.demandas = o.demandas || [];
    var maior = Math.max.apply(null, [0].concat(o.demandas.concat(o.lixeira || [], o.excluidas || []).map(function (d) { return d.id; })));
    EXEMPLOS.forEach(function (ex) {
      var antiga = o.demandas.filter(function (d) { return d.sei === ex.sei; })[0];
      var id = antiga ? antiga.id : ++maior;
      o.demandas = o.demandas.filter(function (d) { return d.sei !== ex.sei; });
      o.demandas.push({
        id: id, sei: ex.sei, descricao: ex.descricao, comarca: ex.comarca,
        responsavel: 'admin', tecnico: null, inicio: '2026-11-05', fim: null, hora: '09:00',
        situacao: 'pendente', ticketPrincipal: ex.ticketPrincipal, ticketEm: { data: '2026-11-03T09:00', usuario: 'admin' }, acionadaEm: '2026-11-03',
        subtickets: ex.subtickets, informacoes: '', historico: historico.slice(),
        criadaEm: '2026-11-03', passou: [], aviso: null
      });
    });
    o.usuario = 'admin'; o.sitAtivas = ['pendente'];
    localStorage.setItem(CHAVE, JSON.stringify(o));
    location.replace('../index.html');
  })();
</script>
</body>
</html>
